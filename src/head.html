<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; frame-src https://www.youtube-nocookie.com; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="eco-logo.svg" type="image/svg+xml">
<title>Eco — ¿Quién soy? · mil9</title>
<meta name="description" content="Eco, de mil9: una adivinanza hecha objeto. Se adivina asiento, perchero y escultura. Edición limitada de 20 unidades. Configurá la tuya.">
<meta property="og:title" content="Eco — ¿Quién soy? · mil9">
<meta property="og:description" content="Una adivinanza hecha objeto. Edición limitada de 20 unidades. Configurá la tuya.">
<meta property="og:image" content="https://eco.milnuevestudio.com/og-eco.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --ink:#232226;
    --ink-soft:#6b6a6e;
    --ink-faint:#9a989c;
    --line:rgba(35,34,38,.14);
    --panel:#f4f3f0;
    --accent:#e0491a;
    --accent-soft:#e8663d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family: "Outfit", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .topbar{
    background:#1c1b1e;
    color:#fff;
    text-align:center;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:26px 56px;
    border-bottom:1px solid var(--line);
  }
  .logo{font-family:"Outfit", sans-serif; font-size:20px; letter-spacing:.01em; font-weight:600;}
  nav{display:flex; gap:36px; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft);}
  nav span{cursor:default; transition:color .15s ease;}
  .breadcrumb{padding:18px 56px 0; font-size:11px; color:var(--ink-faint); letter-spacing:.03em;}
  .hero-title{padding:10px 56px 44px;}
  .hero-title h1{font-family:"Outfit", sans-serif; font-size:40px; font-weight:600; margin:0 0 10px; letter-spacing:-.01em;}
  .hero-title p{font-size:14px; color:var(--ink-soft); max-width:460px; line-height:1.7; margin:0;}

  .configurator{
    display:grid;
    grid-template-columns: 1fr 1.25fr;
    gap:0;
    border-top:1px solid var(--line);
    align-items:start;
  }
  .preview{
    background:var(--panel);
    min-height:560px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:sticky;
    top:0;
    padding:56px;
    box-shadow:inset 0 0 90px rgba(0,0,0,.07);
  }
  .preview-placeholder{
    width:100%;
    max-width:420px;
    aspect-ratio:1/1;
    border:1px dashed #c9c7c0;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:12px;
    color:#4a483f;
    letter-spacing:.04em;
    padding:24px;
  }
  .preview-imgwrap{ position:relative; width:100%; max-width:420px; aspect-ratio:1/1; }
  .preview-imgwrap img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; }
  .preview-caption{
    position:absolute;
    bottom:32px;
    left:56px;
    right:56px;
    font-size:11px;
    color:#4a483f;
    letter-spacing:.05em;
  }

  .panel{padding:52px 56px 72px; border-left:1px solid var(--line);}

  .presets{padding-bottom:28px; border-bottom:1px solid var(--line); margin-bottom:12px;}
  .presets-label{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:12px;}
  .preset-row{display:flex; flex-wrap:wrap; gap:10px;}
  .preset-btn{
    padding:9px 18px; font-size:11px; letter-spacing:.04em; cursor:pointer;
    border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--ink-soft);
    transition:border-color .15s ease, color .15s ease, background .15s ease;
  }
  .preset-btn:hover{border-color:var(--ink); color:var(--ink); background:var(--panel);}

  .step{border-bottom:1px solid var(--line);}
  .step-header{
    width:100%;
    background:none;
    border:none;
    padding:26px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    color:inherit;
  }
  .step:first-child .step-header{padding-top:0;}
  .step-label{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:7px;
  }
  .step-current{font-size:16px;}
  .chevron{
    font-size:11px;
    color:var(--ink-soft);
    transition:transform .15s ease;
    margin-left:12px;
    flex-shrink:0;
  }
  .step.collapsed .chevron{transform:rotate(-90deg);}
  .step-body{padding-bottom:26px;}
  .step.collapsed .step-body{display:none;}

  .group-label{
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:16px 0 10px;
  }
  .group-label:first-child{margin-top:0;}

  .swatches{display:flex; flex-wrap:wrap; gap:14px;}
  .swatch-cell{display:flex; flex-direction:column; align-items:center; gap:6px; width:70px;}
  .swatch-label{font-size:9.5px; color:var(--ink-faint); text-align:center; line-height:1.3;}
  .swatch-cell:has(.swatch.selected) .swatch-label{color:var(--ink); font-weight:500;}
  .swatch{
    width:44px;
    height:44px;
    border-radius:6px;
    border:1px solid var(--line);
    cursor:pointer;
    position:relative;
    padding:0;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .swatch.selected{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--bg), 0 0 0 4px rgba(224,73,26,.35);
  }
  .swatch.branch-active{
    border:1px dashed var(--ink-soft);
  }
  .swatch:hover{border-color:var(--ink-soft);}

  .sub-swatches{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    display:none;
  }
  .sub-swatches.open{display:block;}

  .family-toggle{display:flex; gap:26px; margin-bottom:18px; border-bottom:1px solid var(--line);}
  .family-toggle button{
    flex:none;
    padding:10px 1px;
    margin-bottom:-1px;
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    border:none;
    border-bottom:2px solid transparent;
    background:none;
    color:var(--ink-faint);
    cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .family-toggle button:hover{color:var(--ink-soft);}
  .family-toggle button.active{color:var(--ink); border-bottom-color:var(--accent);}

  .summary{padding:28px 0 0;}
  .summary-line{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:var(--ink-soft);}
  .summary-total{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:18px 0; border-top:1px solid var(--line); margin-top:12px;
  }
  .summary-total .label{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}
  .summary-total .value{font-family:"Outfit", sans-serif; font-size:32px; font-weight:600; color:var(--ink); letter-spacing:-.01em;}
  .cta{
    width:100%; margin-top:26px; padding:16px 24px; background:#1c1b1e; color:#fff;
    border:none; border-radius:999px; font-size:14px; letter-spacing:.01em; text-transform:none; cursor:pointer; font-weight:500;
    transition:background .2s ease;
  }
  .cta:hover{background:var(--accent);}
  .fine-print{font-size:10px; color:var(--ink-faint); margin-top:12px; line-height:1.6;}

  footer{padding:22px 56px; border-top:1px solid var(--line); font-size:10px; color:var(--ink-faint); text-align:center; letter-spacing:.04em;}
  .draft-note{background:transparent; border-bottom:1px solid var(--line); color:var(--ink-faint); font-size:10.5px; padding:9px 56px; letter-spacing:.01em;}

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.78);
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-card{background:var(--bg); border:1px solid var(--line); border-radius:14px; max-width:380px; width:100%; padding:32px; box-shadow:0 20px 60px rgba(0,0,0,.15);}
  .modal-title{font-family:"Outfit", sans-serif; font-size:19px; font-weight:600; margin-bottom:4px;}
  .modal-sub{font-size:12px; color:var(--ink-soft); margin-bottom:20px;}
  .modal-lines{font-size:13px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:16px 0; margin-bottom:16px; display:flex; flex-direction:column; gap:9px;}
  .modal-lines .row{display:flex; justify-content:space-between; gap:12px; color:var(--ink-soft);}
  .modal-lines .row strong{color:var(--ink); font-weight:500; text-align:right;}
  .modal-total{display:flex; justify-content:space-between; font-size:16px; margin-bottom:24px;}
  .modal-actions{display:flex; gap:10px;}
  .modal-btn{flex:1; padding:13px; font-size:13px; letter-spacing:.01em; text-transform:none; cursor:pointer; border:1px solid var(--line); border-radius:999px; background:transparent; color:var(--ink);}
  .modal-btn.solid{background:#1c1b1e; color:#fff; border-color:#1c1b1e;}

  @media (max-width: 860px){
    .configurator{grid-template-columns:1fr;}
    .panel{border-left:none; border-top:1px solid var(--line); padding:32px 24px 52px;}
    header{padding-left:24px; padding-right:24px;}
    .hero-title, .breadcrumb, .draft-note, .topbar, footer{padding-left:24px; padding-right:24px;}
    .preview{position:relative; min-height:auto; padding:32px;}
    nav{display:none;}
    .hero-title h1{font-size:30px;}
    .swatch{width:46px; height:46px;}
    .swatch-label{font-size:10px;}
  }

  @media (max-width: 480px){
    .hero-title h1{font-size:25px;}
    .hero-title p{font-size:13px;}
    .summary-total .value{font-size:27px;}
    .swatch-cell{width:60px;}
    .modal-card{padding:22px;}
    .preview-caption{left:24px; right:24px; bottom:18px;}
  }
</style>
</head>
<body>
